<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8"/>
    <title>Тренажёр распевок</title>
    <base href="/raspevki/"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
    <meta name="description" content="Ежедневные распевки с кривой высоты голоса"/>
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFF1E2"/>
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0A1220"/>
    <script>
      (function () {
        try {
          var theme = JSON.parse(localStorage.getItem('raspevki.theme.v1'));
          if (theme === 'light' || theme === 'dark') {
            document.documentElement.setAttribute('data-theme', theme);
            var color = theme === 'dark' ? '#0A1220' : '#FFF1E2';
            document.querySelectorAll('meta[name="theme-color"]').forEach(function (meta) {
              meta.setAttribute('content', color);
            });
          }
        } catch (error) {}
      })();
    </script>
    <meta name="color-scheme" content="light dark"/>
    <meta name="format-detection" content="telephone=no"/>
    <meta name="mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-title" content="Распевки"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
    <link rel="icon" type="image/x-icon" href="favicon.ico"/>
    <link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192x192.png"/>
    <link rel="manifest" href="manifest.webmanifest"/>
    <link rel="preload" href="fonts/manrope-latin-cyrillic.woff2" as="font" type="font/woff2" crossorigin=""/>
    <link rel="preload" href="fonts/unbounded-latin-cyrillic.woff2" as="font" type="font/woff2" crossorigin=""/>
    <!-- Here and not in the stylesheet: relative URLs resolve against the base href. -->
    <style>
      @font-face {
        font-family: 'Manrope';
        src: url('fonts/manrope-latin-cyrillic.woff2') format('woff2');
        font-weight: 500 800;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Unbounded';
        src: url('fonts/unbounded-latin-cyrillic.woff2') format('woff2');
        font-weight: 400 700;
        font-style: normal;
        font-display: swap;
      }
    </style>
  <link rel="stylesheet" href="styles-NSV7LGAB.css"></head>

</html>
